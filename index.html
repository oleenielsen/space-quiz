<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Exploration Quiz</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f7ff;
        --surface: #ffffff;
        --surface-2: #eef3ff;
        --text: #16203b;
        --muted: #5e6d93;
        --primary: #3f6df6;
        --primary-2: #7a4dff;
        --good: #149b55;
        --bad: #d64444;
        --ring: rgba(63, 109, 246, 0.26);
        --shadow: 0 14px 38px rgba(25, 45, 100, 0.16);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0f1d;
          --surface: #111a31;
          --surface-2: #1a2648;
          --text: #e6ecff;
          --muted: #a7b4db;
          --primary: #80a2ff;
          --primary-2: #b093ff;
          --good: #3ad984;
          --bad: #ff6f6f;
          --ring: rgba(128, 162, 255, 0.28);
          --shadow: 0 14px 38px rgba(0, 0, 0, 0.42);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font-family:
          "Inter",
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        font-size: clamp(14px, 1.35vw, 16px);
        line-height: 1.45;
        background:
          radial-gradient(150% 100% at 100% 0%, rgba(127, 93, 255, 0.14), transparent 52%),
          radial-gradient(130% 80% at 0% 100%, rgba(63, 109, 246, 0.14), transparent 46%),
          var(--bg);
        color: var(--text);
      }

      .quiz {
        width: min(100%, 540px);
        background: linear-gradient(180deg, var(--surface), var(--surface-2));
        border: 1px solid color-mix(in oklab, var(--primary) 22%, transparent);
        border-radius: 18px;
        padding: 22px;
        box-shadow: var(--shadow);
      }

      .top {
        display: grid;
        gap: 10px;
        margin-bottom: 18px;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-weight: 600;
      }

      .progress-track {
        width: 100%;
        height: 10px;
        border-radius: 999px;
        overflow: hidden;
        background: color-mix(in oklab, var(--primary) 14%, transparent);
      }

      .progress-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, var(--primary), var(--primary-2));
        transition: width 340ms ease;
      }

      h1 {
        margin: 0 0 14px;
        font-size: 1.3em;
      }

      .question {
        margin-bottom: 14px;
        font-size: 1.07em;
        font-weight: 700;
      }

      .answers {
        display: grid;
        gap: 10px;
      }

      button.answer {
        width: 100%;
        text-align: left;
        border: 1px solid color-mix(in oklab, var(--primary) 32%, transparent);
        border-radius: 12px;
        padding: 11px 12px;
        color: var(--text);
        background: color-mix(in oklab, var(--surface) 80%, var(--primary) 4%);
        cursor: pointer;
        transition:
          transform 160ms ease,
          border-color 180ms ease,
          box-shadow 180ms ease,
          background 180ms ease;
      }

      button.answer:hover:not(:disabled) {
        transform: translateY(-1px);
        border-color: color-mix(in oklab, var(--primary) 56%, transparent);
        box-shadow: 0 0 0 4px var(--ring);
      }

      button.answer:disabled {
        cursor: not-allowed;
        opacity: 0.94;
      }

      .feedback {
        margin-top: 14px;
        min-height: 1.5em;
        font-weight: 700;
        opacity: 0;
      }

      .feedback.show {
        opacity: 1;
      }

      .feedback.correct {
        color: var(--good);
        animation: pop-glow 520ms ease;
      }

      .feedback.wrong {
        color: var(--bad);
        animation: shake 430ms ease;
      }

      .result {
        text-align: center;
        display: none;
      }

      .result.active {
        display: block;
      }

      .emoji {
        font-size: 2.7rem;
        margin: 6px 0 8px;
        animation: float 1.25s ease-in-out infinite alternate;
      }

      .result h2 {
        margin: 0 0 8px;
      }

      .result p {
        margin: 6px 0;
        color: var(--muted);
      }

      .restart {
        margin-top: 14px;
        border: none;
        border-radius: 11px;
        padding: 10px 14px;
        font: inherit;
        font-weight: 700;
        color: white;
        background: linear-gradient(120deg, var(--primary), var(--primary-2));
        cursor: pointer;
      }

      .quiz.shake {
        animation: shake 430ms ease;
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        22% {
          transform: translateX(-7px);
        }
        44% {
          transform: translateX(6px);
        }
        66% {
          transform: translateX(-4px);
        }
        88% {
          transform: translateX(3px);
        }
      }

      @keyframes pop-glow {
        0% {
          transform: scale(0.95);
          filter: drop-shadow(0 0 0 rgba(20, 155, 85, 0.1));
        }
        55% {
          transform: scale(1.06);
          filter: drop-shadow(0 0 12px color-mix(in oklab, var(--good) 40%, transparent));
        }
        100% {
          transform: scale(1);
          filter: drop-shadow(0 0 0 rgba(20, 155, 85, 0));
        }
      }

      @keyframes float {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-7px);
        }
      }
    </style>
  </head>
  <body>
    <main class="quiz" id="quizBox">
      <h1>🚀 Space Exploration Quiz</h1>

      <section id="quizScreen">
        <div class="top">
          <div class="meta">
            <span id="progressText">Question 1 of 10</span>
            <span id="scoreText">Score: 0</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div class="progress-bar" id="progressBar"></div>
          </div>
        </div>

        <div class="question" id="questionText"></div>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback"></div>
      </section>

      <section class="result" id="resultScreen" aria-live="polite">
        <div class="emoji" id="resultEmoji"></div>
        <h2>Quiz Complete</h2>
        <p id="finalScore"></p>
        <p id="resultMessage"></p>
        <button class="restart" id="restartBtn" type="button">Play Again</button>
      </section>
    </main>

    <script>
      const questions = [
        {
          q: "Which mission first landed humans on the Moon?",
          options: ["Apollo 11", "Apollo 8", "Sputnik 1", "Gemini 4"],
          answer: "Apollo 11"
        },
        {
          q: "What is the largest planet in our solar system?",
          options: ["Saturn", "Neptune", "Jupiter", "Earth"],
          answer: "Jupiter"
        },
        {
          q: "Which planet is known as the Red Planet?",
          options: ["Mars", "Venus", "Mercury", "Uranus"],
          answer: "Mars"
        },
        {
          q: "What do we call a rocky object that burns up in Earth's atmosphere?",
          options: ["Comet", "Asteroid", "Meteor", "Moonlet"],
          answer: "Meteor"
        },
        {
          q: "Which telescope has captured deep-space images from orbit since 1990?",
          options: ["Kepler Space Telescope", "Hubble Space Telescope", "Chandra X-ray Observatory", "James Webb Space Telescope"],
          answer: "Hubble Space Telescope"
        },
        {
          q: "What is the name of NASA's Mars rover that landed in 2021?",
          options: ["Spirit", "Perseverance", "Opportunity", "Curiosity"],
          answer: "Perseverance"
        },
        {
          q: "Which planet has the most extensive visible ring system?",
          options: ["Jupiter", "Uranus", "Neptune", "Saturn"],
          answer: "Saturn"
        },
        {
          q: "What is the term for the path a spacecraft follows around a celestial body?",
          options: ["Axis", "Orbit", "Trajectory", "Vector"],
          answer: "Orbit"
        },
        {
          q: "Which was the first artificial satellite launched into space?",
          options: ["Explorer 1", "Vostok 1", "Sputnik 1", "Skylab"],
          answer: "Sputnik 1"
        },
        {
          q: "Where is the International Space Station primarily located?",
          options: ["On the Moon", "In low Earth orbit", "At Earth's Lagrange point L1", "On Mars"],
          answer: "In low Earth orbit"
        }
      ];

      const questionText = document.getElementById("questionText");
      const answersEl = document.getElementById("answers");
      const progressText = document.getElementById("progressText");
      const scoreText = document.getElementById("scoreText");
      const progressBar = document.getElementById("progressBar");
      const feedback = document.getElementById("feedback");
      const quizScreen = document.getElementById("quizScreen");
      const resultScreen = document.getElementById("resultScreen");
      const finalScore = document.getElementById("finalScore");
      const resultMessage = document.getElementById("resultMessage");
      const resultEmoji = document.getElementById("resultEmoji");
      const restartBtn = document.getElementById("restartBtn");
      const quizBox = document.getElementById("quizBox");

      let index = 0;
      let score = 0;
      let locked = false;

      function renderQuestion() {
        const current = questions[index];
        progressText.textContent = `Question ${index + 1} of ${questions.length}`;
        scoreText.textContent = `Score: ${score}`;
        progressBar.style.width = `${(index / questions.length) * 100}%`;
        questionText.textContent = current.q;
        feedback.className = "feedback";
        feedback.textContent = "";
        answersEl.innerHTML = "";

        current.options.forEach((option) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "answer";
          btn.textContent = option;
          btn.addEventListener("click", () => handleAnswer(btn, option));
          answersEl.appendChild(btn);
        });
      }

      function handleAnswer(button, picked) {
        if (locked) return;
        locked = true;

        const current = questions[index];
        const correct = picked === current.answer;
        const allButtons = [...answersEl.querySelectorAll("button.answer")];

        allButtons.forEach((btn) => {
          btn.disabled = true;
          if (btn.textContent === current.answer) {
            btn.style.borderColor = "var(--good)";
            btn.style.background = "color-mix(in oklab, var(--good) 16%, var(--surface))";
          }
        });

        if (correct) {
          score += 1;
          scoreText.textContent = `Score: ${score}`;
          button.style.borderColor = "var(--good)";
          feedback.className = "feedback show correct";
          feedback.textContent = "✅ Correct!";
        } else {
          button.style.borderColor = "var(--bad)";
          button.style.background = "color-mix(in oklab, var(--bad) 13%, var(--surface))";
          feedback.className = "feedback show wrong";
          feedback.textContent = `❌ Not quite. Correct answer: ${current.answer}`;

          quizBox.classList.remove("shake");
          void quizBox.offsetWidth;
          quizBox.classList.add("shake");
        }

        setTimeout(() => {
          index += 1;
          locked = false;
          quizBox.classList.remove("shake");
          if (index < questions.length) {
            renderQuestion();
          } else {
            showResults();
          }
        }, 920);
      }

      function showResults() {
        quizScreen.style.display = "none";
        resultScreen.classList.add("active");
        progressBar.style.width = "100%";
        finalScore.textContent = `You scored ${score} out of ${questions.length}.`;

        const pct = (score / questions.length) * 100;
        if (pct >= 90) {
          resultEmoji.textContent = "🏆";
          resultMessage.textContent = "Outstanding mission control skills!";
        } else if (pct >= 70) {
          resultEmoji.textContent = "😄";
          resultMessage.textContent = "Great job exploring the cosmos!";
        } else if (pct >= 50) {
          resultEmoji.textContent = "🙂";
          resultMessage.textContent = "Solid effort—keep reaching for the stars.";
        } else {
          resultEmoji.textContent = "🛰️";
          resultMessage.textContent = "Nice try—another launch will boost your score.";
        }
      }

      restartBtn.addEventListener("click", () => {
        index = 0;
        score = 0;
        locked = false;
        resultScreen.classList.remove("active");
        quizScreen.style.display = "block";
        renderQuestion();
      });

      renderQuestion();
    </script>
  </body>
</html>
